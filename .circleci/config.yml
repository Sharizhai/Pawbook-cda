version: 2.1

# Orbs
orbs:
  node: circleci/node@5.2.0

# Commandes réutilisables
commands:
  install-pnpm:
    description: "Installer pnpm"
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.33.0

  restore-dependencies:
    description: "Restaurer le cache des dépendances"
    steps:
      - restore_cache:
          keys:
            - pnpm-packages-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-packages-v1-

  install-dependencies:
    description: "Installer les dépendances du monorepo"
    steps:
      - run:
          name: Install dependencies
          command: |
            rm -rf node_modules
            pnpm install --frozen-lockfile
      - run:
          name: Install rolldown native binding for Linux
          command: |
            ROLLDOWN_DIR="node_modules/.pnpm/rolldown@1.0.0-rc.12_@emnapi+core@1.9.1_@emnapi+runtime@1.9.1/node_modules"
            TEMP_DIR=$(mktemp -d)
            curl -sL https://registry.npmjs.org/@rolldown/binding-linux-x64-gnu/-/binding-linux-x64-gnu-1.0.0-rc.12.tgz | tar xz --strip-components=1 -C ${TEMP_DIR}
            mkdir -p ${ROLLDOWN_DIR}/@rolldown/binding-linux-x64-gnu
            cp ${TEMP_DIR}/*.node ${ROLLDOWN_DIR}/@rolldown/binding-linux-x64-gnu/
            cp ${TEMP_DIR}/package.json ${ROLLDOWN_DIR}/@rolldown/binding-linux-x64-gnu/    

  save-dependencies:
    description: "Sauvegarder le cache des dépendances"
    steps:
      - save_cache:
          key: pnpm-packages-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - packages/client/node_modules
            - packages/server/node_modules
            - ~/.pnpm-store

# Définition des jobs
jobs:
  # Job pour le frontend (client)
  test-client:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - install-pnpm
      - restore-dependencies
      - install-dependencies
      - save-dependencies
      - run:
          name: Compile localization files
          command: |
            cd packages/client
            pnpm run compile-localization
      - run:
          name: Run client tests
          command: |
            cd packages/client
            pnpm run test
      - run:
          name: Generate coverage report
          command: |
            cd packages/client
            pnpm run coverage
      - store_test_results:
          path: packages/client/coverage
      - store_artifacts:
          path: packages/client/coverage

  # Job pour le backend (server)
  test-server:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - install-pnpm
      - restore-dependencies
      - install-dependencies
      - save-dependencies
      - run:
          name: Run server tests
          command: |
            cd packages/server
            pnpm run test:run
      - run:
          name: Generate coverage report
          command: |
            cd packages/server
            pnpm run test:coverage
      - store_test_results:
          path: packages/server/coverage
      - store_artifacts:
          path: packages/server/coverage

  # Job pour builder le frontend
  build-client:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - install-pnpm
      - restore-dependencies
      - install-dependencies
      - save-dependencies
      - run:
          name: Build client
          command: |
            cd packages/client
            pnpm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - packages/client/dist
      - store_artifacts:
          path: packages/client/dist

  # Job pour builder le backend
  build-server:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - install-pnpm
      - restore-dependencies
      - install-dependencies
      - save-dependencies
      - run:
          name: Build server
          command: |
            cd packages/server
            pnpm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - packages/server/dist
      - store_artifacts:
          path: packages/server/dist

# Workflows
workflows:
  version: 2

  # Workflow pour develop : tests + builds systématiques
  develop-workflow:
    jobs:
      - test-client:
          filters:
            branches:
              only: develop
      - test-server:
          filters:
            branches:
              only: develop
      - build-client:
          requires:
            - test-client
          filters:
            branches:
              only: develop
      - build-server:
          requires:
            - test-server
          filters:
            branches:
              only: develop

  # Workflow pour production : tests + builds + (futur: déploiement)
  production-workflow:
    jobs:
      - test-client:
          filters:
            branches:
              only: production
      - test-server:
          filters:
            branches:
              only: production
      - build-client:
          requires:
            - test-client
          filters:
            branches:
              only: production
      - build-server:
          requires:
            - test-server
          filters:
            branches:
              only: production